<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#EDD5CA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C45C3E"/>
      <stop offset="100%" stop-color="#A84A32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)"/>
  <!-- Brand mark -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="12" fill="#C45C3E"/>
    <text x="32" y="46" font-family="Georgia, serif" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF">B</text>
    <text x="84" y="42" font-family="Georgia, serif" font-size="28" font-weight="600" fill="#2D2D2D">Bilbao Reforma</text>
  </g>
  <!-- Title -->
  <text x="80" y="290" font-family="Georgia, serif" font-size="62" font-weight="700" fill="#2D2D2D">Licencias de Obra</text>
  <text x="80" y="362" font-family="Georgia, serif" font-size="62" font-weight="700" fill="#C45C3E">Bilbao 2026</text>
  <!-- Subtitle -->
  <text x="80" y="430" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="500" fill="#6B6B6B">Tipos, costes, plazos y cómo tramitarlas</text>
  <!-- Decorative icons row -->
  <g transform="translate(80, 500)" fill="none" stroke="#C45C3E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- doc icon -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="56" height="72" rx="4"/>
      <line x1="12" y1="20" x2="44" y2="20"/>
      <line x1="12" y1="36" x2="44" y2="36"/>
      <line x1="12" y1="52" x2="32" y2="52"/>
    </g>
    <!-- building icon -->
    <g transform="translate(120, 0)">
      <path d="M0 72 L0 24 L28 0 L56 24 L56 72 Z"/>
      <line x1="20" y1="72" x2="20" y2="40"/>
      <line x1="36" y1="72" x2="36" y2="40"/>
    </g>
    <!-- clock icon -->
    <g transform="translate(240, 0)">
      <circle cx="28" cy="36" r="28"/>
      <polyline points="28 16 28 36 44 44"/>
    </g>
    <!-- euro icon -->
    <g transform="translate(360, 0)">
      <path d="M44 16 C36 8 16 8 12 28 L8 36 L12 44 C16 64 36 64 44 56"/>
      <line x1="0" y1="28" x2="24" y2="28"/>
      <line x1="0" y1="44" x2="24" y2="44"/>
    </g>
  </g>
  <!-- Bottom bar -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#accent)" opacity="0.3"/>
  <text x="80" y="600" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#6B6B6B">bilbaoreforma.es</text>
  <text x="1120" y="600" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#6B6B6B">Guía actualizada junio 2026</text>
</svg>
